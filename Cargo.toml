[package]
  name = "hyprcolors"
  version = "0.1.0"
  edition = "2024"

[dependencies]
  anyhow = "1"
  thiserror = "2"

  log = "0.4"
  env_logger = "0.11"

  smithay-client-toolkit = "0.20"
  wayland-client = "0.31"

  calloop = "0.14"
  calloop-wayland-source = "0.4"

  image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

  serde = { version = "1", features = ["derive"] }
  serde_json = "1"

[profile.release]
  lto = "thin"
  codegen-units = 1
  strip = true

[profile.dev]
  opt-level = 1
